[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-gridiron"
version = "0.1.0a0"
description = "Professional football analytics platform with automated data pipelines, ratings, and predictive modeling."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "duckdb>=1.3,<2",
    "nflreadpy>=0.1,<1",
    "numpy>=2,<3",
    "polars>=1.30,<2",
    "pyarrow>=20,<24",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]
modeling = [
    "scikit-learn>=1.7,<2",
]

[project.scripts]
gridiron = "gridiron.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"
